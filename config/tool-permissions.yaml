# Frontier Intelligence Engine - Tool Permissions & Sandboxing Policy

permissions:
  file_management:
    enabled: true
    allowed_roots:
      - "."
      - "./workspace"
      - "./output"
    blocked_patterns:
      - "../*"
      - "*.env*"
      - "*id_rsa*"
      - "*credentials*"
    allow_overwrite: true
    max_file_size_bytes: 10485760 # 10 MB

  code_execution:
    enabled: true
    interpreter: "python"
    timeout_seconds: 15
    max_memory_mb: 256
    blocked_modules:
      - "pty"
    allowed_network_during_exec: false

  google_search_grounding:
    enabled: true
    enforce_dynamic_threshold: 0.3
    safe_search: true

  http_client:
    enabled: true
    timeout_seconds: 10
    allow_redirects: true
    max_response_bytes: 5242880 # 5 MB
    blocked_hostnames:
      - "localhost"
      - "127.0.0.1"
      - "169.254.169.254"
      - "::1"
